<svg width="800" height="280" viewBox="0 0 800 280" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .rain-col text {
        fill: #00FF41;
        font-family: 'Courier New', monospace;
        font-size: 14px;
        opacity: 0.55;
      }
      .rain-col { animation: fall linear infinite; }
      @keyframes fall {
        0%   { transform: translateY(-260px); }
        100% { transform: translateY(280px); }
      }
      .screen-glow {
        fill: #00FF41;
        opacity: 0.18;
        animation: pulse 2.4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.12; }
        50%      { opacity: 0.28; }
      }
      .cursor {
        fill: #00FF41;
        animation: blink 1s steps(1) infinite;
      }
      @keyframes blink {
        0%, 49%  { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .term-line {
        fill: #00FF41;
        font-family: 'Courier New', monospace;
        font-size: 9px;
      }
      .hacker { fill: #050608; }
      .hoodie-highlight { fill: #12151a; }
    </style>
  </defs>

  <rect class="bg" width="800" height="280" rx="14" />

  <!-- Matrix rain columns -->
  <g clip-path="url(#clip)">
    <clipPath id="clip"><rect width="800" height="280" rx="14" /></clipPath>
    <g class="rain-col" style="animation-duration:3.2s;"><text x="20" y="0">01</text><text x="20" y="18">10</text><text x="20" y="36">λ</text><text x="20" y="54">グ</text><text x="20" y="72">01</text></g>
    <g class="rain-col" style="animation-duration:4.1s; animation-delay:-1s;"><text x="60" y="0">ネ</text><text x="60" y="18">11</text><text x="60" y="36">00</text><text x="60" y="54">ト</text></g>
    <g class="rain-col" style="animation-duration:2.7s; animation-delay:-0.5s;"><text x="100" y="0">10</text><text x="100" y="18">ワ</text><text x="100" y="36">01</text><text x="100" y="54">λ</text></g>
    <g class="rain-col" style="animation-duration:3.6s; animation-delay:-2s;"><text x="140" y="0">ク</text><text x="140" y="18">01</text><text x="140" y="36">10</text></g>
    <g class="rain-col" style="animation-duration:5s; animation-delay:-1.5s;"><text x="620" y="0">01</text><text x="620" y="18">ス</text><text x="620" y="36">10</text><text x="620" y="54">λ</text></g>
    <g class="rain-col" style="animation-duration:3s; animation-delay:-0.8s;"><text x="670" y="0">テ</text><text x="670" y="18">00</text><text x="670" y="36">11</text></g>
    <g class="rain-col" style="animation-duration:4.4s; animation-delay:-2.2s;"><text x="720" y="0">ム</text><text x="720" y="18">01</text><text x="720" y="36">10</text><text x="720" y="54">グ</text></g>
    <g class="rain-col" style="animation-duration:2.9s; animation-delay:-1.2s;"><text x="760" y="0">10</text><text x="760" y="18">01</text><text x="760" y="36">ワ</text></g>
  </g>

  <!-- Desk -->
  <rect x="240" y="230" width="320" height="10" rx="3" fill="#1c2128" />

  <!-- Hacker silhouette (hoodie, sitting) -->
  <g class="hacker">
    <ellipse cx="400" cy="120" rx="30" ry="32" /> <!-- head/hood -->
    <path d="M355 150 Q400 135 445 150 L460 235 L340 235 Z" /> <!-- hoodie body -->
    <path d="M355 150 Q330 165 322 205 L336 210 Q345 175 362 158 Z" /> <!-- left arm -->
    <path d="M445 150 Q470 165 478 205 L464 210 Q455 175 438 158 Z" /> <!-- right arm -->
  </g>
  <path d="M370 145 Q400 160 430 145 L430 160 Q400 175 370 160 Z" class="hoodie-highlight" />

  <!-- Laptop -->
  <g>
    <rect x="330" y="205" width="140" height="8" rx="2" fill="#1c2128" /> <!-- keyboard base -->
    <path d="M335 205 L340 155 L460 155 L465 205 Z" fill="#050608" /> <!-- screen back -->
    <rect x="345" y="160" width="110" height="42" rx="2" fill="#010202" /> <!-- screen inner -->
    <rect x="345" y="160" width="110" height="42" rx="2" class="screen-glow" />
    <text x="350" y="172" class="term-line">$ ssh root@kavithz</text>
    <text x="350" y="183" class="term-line">access: granted</text>
    <text x="350" y="194" class="term-line">$ building...<tspan class="cursor">▉</tspan></text>
  </g>

  <!-- Caption -->
  <text x="400" y="270" text-anchor="middle" fill="#00FF41" font-family="Courier New, monospace" font-size="13" opacity="0.85">root@kavithz:~$ compiling_the_future.sh</text>
</svg>
